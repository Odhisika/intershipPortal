<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName internship.lig.com.gh

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/internship.lig.com.gh/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/internship.lig.com.gh/privkey.pem

    DocumentRoot /var/www/intern

    WSGIDaemonProcess internship python-path=/var/www/intern python-home=/var/www/intern/venv
    WSGIProcessGroup internship
    WSGIScriptAlias / /var/www/intern/ligplatform/wsgi.py

    Alias /static/ /var/www/intern/staticfiles/
    <Directory /var/www/intern/staticfiles>
        Require all granted
    </Directory>

    Alias /media/ /var/www/intern/media/
    <Directory /var/www/intern/media>
        Require all granted
    </Directory>

    <Directory /var/www/intern/ligplatform>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/internship_error.log
    CustomLog ${APACHE_LOG_DIR}/internship_access.log combined
</VirtualHost>
</IfModule>
