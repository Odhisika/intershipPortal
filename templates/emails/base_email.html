<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:40px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

  <!-- Header -->
  <tr>
  <td style="background-color:#1a1a2e;padding:30px 40px;text-align:center;">
    <img src="https://internship.lig.com.gh/static/images/logo.jpg" alt="LuckyTech Innovation Ground" width="120" style="display:block;margin:0 auto 14px;width:120px;height:auto;border-radius:8px;">
    <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:600;letter-spacing:0.5px;">LuckyTech Innovation Ground</h1>
    <p style="margin:6px 0 0;color:#a0a0b8;font-size:12px;letter-spacing:1px;text-transform:uppercase;">Attachment Programme Portal</p>
  </td>
  </tr>

  <!-- Body -->
  <tr>
  <td style="padding:40px;">
    {{ content|safe }}
  </td>
  </tr>

  <!-- Divider -->
  <tr>
  <td style="padding:0 40px;">
    <hr style="border:none;border-top:1px solid #eef0f4;margin:0;">
  </td>
  </tr>

  <!-- Footer -->
  <tr>
  <td style="padding:25px 40px;text-align:center;">
    <p style="margin:0;color:#8a8a9a;font-size:12px;line-height:1.6;">
      This email was sent by LuckyTech Innovation Ground.<br>
      If you did not expect this email, you can safely ignore it.
    </p>
    <p style="margin:12px 0 0;color:#b0b0c0;font-size:11px;">
      &copy; {{ year }} LuckyTech Innovation Ground. All rights reserved.
    </p>
  </td>
  </tr>

</table>
</td></tr>
</table>
</body>
</html>
